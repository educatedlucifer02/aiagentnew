services:
  - type: web
    name: kimi-agent
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NVIDIA_API_KEY
        fromDatabase:
          name: kimi-agent-db
          property: nvidia_api_key
      - key: NODE_ENV
        value: production
    plan: starter
    regions:
      - ohio
    healthCheckPath: /api/health

databases:
  - name: kimi-agent-db
    plan: starter
    region: ohio

